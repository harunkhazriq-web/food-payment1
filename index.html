</head>

<body>

<div class="payment-box">

```
<h1>💳 Food Payment</h1>

<p>Sila buat pembayaran menggunakan QR di bawah.</p>

<img src="qr.jpeg"
     class="qr"
     alt="QR Payment">

<div class="info">
    <b>Selepas membuat pembayaran</b>
    <br><br>
    Pilih resit pembayaran anda.
</div>

<input
    type="file"
    id="receipt"
    accept="image/*,.pdf"
    onchange="previewReceipt()"
>

<div class="preview" id="preview">

    <p>🧾 <b>Preview Resit</b></p>

    <img id="receiptImage"
         alt="Preview Resit">

</div>

<button id="uploadButton"
        onclick="uploadReceipt()">

    📤 UPLOAD RESIT

</button>

<div id="status"></div>
```

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzsLAIR1M7JYGNjgNTnjXQ2H_ofHJmDpdhPxq7mA27BPmDdyRMsjaYuRn4NtbgTzsgVCw/exec";


function previewReceipt() {

    const input =
        document.getElementById("receipt");

    const preview =
        document.getElementById("preview");

    const image =
        document.getElementById("receiptImage");

    const status =
        document.getElementById("status");


    if (input.files.length === 0) {

        preview.style.display = "none";
        status.innerHTML = "";

        return;
    }


    const file = input.files[0];


    status.style.color = "green";

    status.innerHTML =
        "✅ Resit dipilih: " + file.name;


    if (file.type.startsWith("image/")) {

        const reader = new FileReader();


        reader.onload = function(e) {

            image.src = e.target.result;

            preview.style.display = "block";

        };


        reader.readAsDataURL(file);

    } else {

        preview.style.display = "none";

    }

}


function uploadReceipt() {

    const input =
        document.getElementById("receipt");

    const button =
        document.getElementById("uploadButton");

    const status =
        document.getElementById("status");


    if (input.files.length === 0) {

        status.style.color = "red";

        status.innerHTML =
            "❌ Sila pilih resit dahulu.";

        return;
    }


    const file =
        input.files[0];


    button.disabled = true;

    button.innerHTML =
        "⏳ UPLOAD...";

    status.style.color = "black";

    status.innerHTML =
        "⏳ Sedang menghantar resit...";


    const reader =
        new FileReader();


    reader.onload = function(e) {

        const base64 =
            e.target.result.split(",")[1];


        const data = {

            fileName: file.name,

            mimeType: file.type,

            file: base64

        };


        const formData =
            new URLSearchParams();


        formData.append(
            "data",
            JSON.stringify(data)
        );


        fetch(SCRIPT_URL, {

            method: "POST",

            body: formData

        })

        .then(function(response) {

            return response.json();

        })

        .then(function(result) {

            if (result.success) {

                status.style.color =
                    "green";

                status.innerHTML =
                    "✅ RESIT BERJAYA DISIMPAN!<br><br>" +
                    "Nama fail: " +
                    result.fileName;

                button.innerHTML =
                    "✅ BERJAYA";

            } else {

                throw new Error(
                    result.error
                );

            }

        })

        .catch(function(error) {

            console.error(error);

            status.style.color =
                "red";

            status.innerHTML =
                "❌ Upload gagal.<br>" +
                error.message;

            button.disabled =
                false;

            button.innerHTML =
                "📤 UPLOAD RESIT";

        });

    };


    reader.readAsDataURL(file);

}

</script>

</body>
</html>
